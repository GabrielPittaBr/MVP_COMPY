name: mvp_compy
description: COMPY — App para conectar praticantes de esportes em Taquara/RS.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # Textos nativos (calendário, relógio, menus de texto) em pt-BR
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Estado
  flutter_riverpod: ^2.5.1

  # Navegação
  go_router: ^14.2.0

  # Backend (scaffold — datasources reais, mas repositories servem mock por padrão)
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_app_check: ^0.3.0
  firebase_storage: ^12.4.10

  # Login com Google (RF — autenticação social)
  google_sign_in: ^6.2.1

  # Mapa OSM (sem API key — RF04)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Geolocalização do usuário (RF03 — eventos próximos por raio real)
  geolocator: ^13.0.1

  # Tipografia
  google_fonts: ^6.2.1

  # Imagens em rede com cache
  cached_network_image: ^3.3.1
  url_launcher: ^6.3.1

  # Foto de perfil: escolher (galeria/câmera), recortar com zoom e reduzir
  # para JPEG antes do envio
  image_picker: ^1.2.4
  crop_your_image: ^2.0.1
  image: ^4.12.0

  # Util
  intl: ^0.20.2
  equatable: ^2.0.5

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

  # Geração do ícone do app (launcher icon)
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/compy-icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
